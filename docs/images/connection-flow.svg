<g font-size="17" fill="#50625b"><text x="56" y="163">完成邮箱验证</text><text x="56" y="195">确认账户信源授权</text><text x="372" y="163">下载 API / MCP 信息</text><text x="372" y="195">私下保存个人访问令牌</text><text x="688" y="163">导入 JSON，填写令牌</text><text x="688" y="195">保存连接 → 检查连接</text><text x="1004" y="163">HTTP / SSE 自动更新</text><text x="1004" y="195">读取原文、版本与引用</text></g>
